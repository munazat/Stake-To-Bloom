name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Test · Build · Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks scans the pushed commit range; a shallow clone (the default)
          # hides the range's base commit and fails with "unknown revision".
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      - name: Install
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      # The Edge Functions run under Deno, so tsc above never sees them: they use
      # npm: specifiers and .ts-suffixed relative imports. This is the step that
      # would have caught a missing await before it reached the database.
      - name: Typecheck (edge functions)
        run: npm run check:functions

      - name: Test (all workspaces)
        run: npm run test --workspaces --if-present

      - name: Build web SPA
        run: npm run build --workspace @bloomstake/web

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
