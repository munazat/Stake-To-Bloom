# Supabase project configuration for BloomStake.
# Local dev: `supabase start` (Docker) then `supabase functions serve`.
project_id = "bloomstake"

[api]
enabled = true

# Guests play in an anonymous session (blueprint §5, §9); no credentials needed.
[auth]
enable_signup = true
enable_anonymous_sign_ins = true

# Writes pacts, so it must only accept a token GoTrue has validated. Stated
# explicitly rather than left to the default: a future CLI default change should
# not silently open a money-adjacent endpoint.
[functions.pact-create]
verify_jwt = true

# PayPal cannot send a Supabase JWT, so this one function is public at the gateway.
# It authenticates the caller by verifying PayPal's own signature
# (paypal-webhook/flow.ts) and does nothing without it.
[functions.paypal-webhook]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = true

[functions.paypal-capture-order]
verify_jwt = true

[functions.demo-bootstrap]
verify_jwt = true

[functions.demo-advance]
verify_jwt = true

# These routes authenticate with their own high-entropy shared secrets.
[functions.cron-tick]
verify_jwt = false

[functions.ops-health]
verify_jwt = false

[functions.admin-retry]
verify_jwt = false

[functions.refund-pact]
verify_jwt = true

[functions.settle-pact]
verify_jwt = false

[functions.settlement-poll]
verify_jwt = false

[functions.demo-proof-purge]
verify_jwt = false
